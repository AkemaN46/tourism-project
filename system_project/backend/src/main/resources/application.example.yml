server:
  port: 8082
  servlet:
    context-path: /

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mysql://localhost:3306/xi_an_xiao_zhu?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB

# 微信小程序配置
wechat:
  miniprogram:
    appid: ${WECHAT_APPID}
    secret: ${WECHAT_SECRET}

app:
  jwt:
    secret: ${JWT_SECRET}
    user-expiration-ms: 604800000
    admin-expiration-ms: 28800000
  upload-dir: ${UPLOAD_DIR:./uploads/images}
  admin:
    initial-password: ${ADMIN_INITIAL_PASSWORD}

logging:
  level:
    com.homestay.xiaozhu: debug
