- title: "1.管理员创建房型"
  keyword: create_room
  method: POST
  url: /room/create
  homestay_data:
    name: "房型自动化测试民宿"
    phone: "029-12345678"
    address: "西安市碑林区房型自动化测试路100号"
    description: "房型创建前置民宿"
    coverImage: "/images/api-auto-room-homestay.jpg"
    status: 1
  room_data:
    roomTypeId: 1
    name: "自动化测试大床房"
    description: "接口自动化创建的房型"
    price: 299.00
    originalPrice: 399.00
    area: 30
    bedType: "1.8米大床"
    peopleNum: 2
    stock: 5
    status: 1
    coverImage: "/images/api-auto-room.jpg"
    gallery: "[]"
